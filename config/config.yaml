meta:
  name: "Grid Pipeline Constraint DSL"
  version: "1.0.3"
  model_type: "constraint_validation_system"
  description: >
    Fully declarative rule system for validating user-authored
    pipeline grid layouts. No simulation or execution semantics.

# --------------------------------------------------
# PIPELINE STRUCTURE (SCHEDULING LATTICE)
# --------------------------------------------------
pipeline:
  stages:
    1: [F(1), D(1), i(0), I(1)]

    2:
      MUL:   [Y0(1), Y1(1), Y2(1), Y3(1)]
      ALU:   [X(1)]
      LOAD:  [L0(1), L1(1)]
      STORE: [S(1)]

    3: [W(1), r(0), C(1)]

instructions:

  add:
    operands: [rd, rs1, rs2]
    valid_path: ALU
    format: "add rd, rs1, rs2"
    read_dependency:  reg_update
    write_dependency: reg_update
    when_start:       X   # execution begins here; consumer needs operands by this stage
    when_done:        X   # result available for forwarding from this stage onward
    values_committed: C   # result written to architectural register file here
    decoded:          D   # operands become addressable here; earliest valid bypass target

rules:

  # ==================================================
  # RAW DEPENDENCY RULE
  # ==================================================
  - name: "RAW Hazard"
    type: "dependency_rule"
    dep_class: "RAW"
    description: >
      Detects Read After Write hazards. The dependency graph (driven by
      write_dependency / read_dependency type matching) pre-filters iteration
      to instruction pairs that share a register, so this when block only
      needs to express the temporal constraint.

      Violation fires when:
        col(values_committed of producer) > col(when_start of consumer)
        — the producer has not yet committed to the register file when the
          consumer begins execution.

      Resolved by a bypass annotation where:
        source.col >= col(when_done of producer)     [from X or later]
        col(decoded of consumer) <= target.col       [not before decode]
        target.col < col(when_start of consumer)     [before execution]

      Valid paths for add: X→D, X→I, W→D, W→I
    when:
      all:
        - temporal_hazard:
            args: [producer, consumer]
            producer_stage_attr: values_committed
            consumer_stage_attr: when_start
            operator: gte
        - not:
            temporal_bypass_exists:
              args: [producer, consumer]
              source_stage_attr:     when_done
              target_min_stage_attr: decoded
              target_max_stage_attr: when_start
    then:
      highlight:
        type: "dependency"
        label: "RAW"
        color: "#cc0000"

  # ==================================================
  # WAR / WAW — infrastructure demo
  # (uncomment and adjust stage attrs as needed)
  # ==================================================

  # - name: "WAW Hazard"
  #   type: "dependency_rule"
  #   dep_class: "WAW"
  #   description: >
  #     Both instructions write the same register (write_dependency matches).
  #     Fires when producer commits after consumer commits, meaning the
  #     register may end up holding the producer's (older) value.
  #   when:
  #     temporal_hazard:
  #       args: [producer, consumer]
  #       producer_stage_attr: values_committed
  #       consumer_stage_attr: values_committed
  #       operator: gt
  #   then:
  #     highlight:
  #       label: "WAW"
  #       color: "#9900cc"

  # - name: "WAR Hazard"
  #   type: "dependency_rule"
  #   dep_class: "WAR"
  #   description: >
  #     Producer reads a register that consumer writes (read_dependency of
  #     producer matches write_dependency of consumer). Fires when the
  #     consumer writes before the producer has read, i.e.
  #     col(when_done of consumer) < col(when_start of producer).
  #   when:
  #     temporal_hazard:
  #       args: [consumer, producer]      # note: args reversed for WAR
  #       producer_stage_attr: when_done
  #       consumer_stage_attr: when_start
  #       operator: lt
  #   then:
  #     highlight:
  #       label: "WAR"
  #       color: "#cc6600"

  # ==================================================
  # PIPELINE SEQUENCE CONSTRAINT
  # ==================================================
  - name: "Pipeline Sequence Constraint"
    type: "ordering_rule"
    description: >
      Ensures instruction progression follows the pipeline-defined stage order.
      Fires when a later column holds a stage with a smaller pipeline depth
      than the preceding column (backward movement).
    when:
      any:
        - lt:
            - stage_index(stage_of(current))
            - stage_index(stage_of(previous))
        - not:
            in_pipeline_order:
              args:
                - stage_of(previous)
                - stage_of(current)
    then:
      highlight:
        type: "ordering_violation"
        label: "SEQ"
        color: "#006600"

  # ==================================================
  # RESOURCE CAPACITY CONSTRAINT
  # ==================================================
  - name: "Resource Capacity Constraint"
    type: "capacity_rule"
    description: >
      Ensures pipeline stage resources are not exceeded per column.
      Stages with capacity 0 are unbounded and are never flagged.
    when:
      any:
        - gt:
            - resource_used(stage(current), column(current))
            - stage_capacity(stage(current))
    then:
      highlight:
        type: "resource_violation"
        label: "CAP"
        color: "#0066cc"

# --------------------------------------------------
# BYPASS MODEL (VISUAL ONLY — FUNCTIONALLY EQUIVALENT)
# --------------------------------------------------
bypass:

  semantics: "uniform"

  exists(a, b): true

  annotation_only: true

  colors:
    RAW: "#cc0000"
    WAR: "#cc6600"
    WAW: "#9900cc"
    CONTROL: "#006600"
    STRUCTURAL: "#0066cc"

# --------------------------------------------------
# DEFAULT BEHAVIOR
# --------------------------------------------------
defaults:

  evaluation_mode: "validation_only"

  unknown_expression:
    action: ignore

  no_violation:
    action: no_highlight

  rows: 10
  cols: 10

  start_state: "./config/tiny_rv1_example.json"