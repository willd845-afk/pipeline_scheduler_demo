meta:
  name: "Grid Pipeline Constraint DSL"
  version: "1.0"
  model_type: "constraint_validation_system"
  description: >
    Fully declarative rule system for validating user-authored
    pipeline grid layouts. No simulation or execution semantics.

# --------------------------------------------------
# PIPELINE STRUCTURE (SCHEDULING LATTICE)
# --------------------------------------------------
pipeline:
  stages:
    1: [F(1), D(1), i*(0), I(1)]

    2:
      MUL:   [Y0(1), Y1(1), Y2(1), Y3(1)]
      ALU:   [X(1)]
      LOAD:  [L0(1), L1(1)]
      STORE: [S(1)]

    3: [W(1), r*(0), C(1)]

# --------------------------------------------------
# INSTRUCTION MODEL (DEPENDENCY + PATH SEMANTICS)
# --------------------------------------------------
instructions:

  add:
    operands: [rd, rs1, rs2]
    valid_path: ALU
    format: "add rd, rs1, rs2"
    read_dependency: reg_update
    write_dependency: reg_update
    when_done: X

# --------------------------------------------------
# RULE SYSTEM (PURE DECLARATIVE CONSTRAINTS)
# --------------------------------------------------
rules:

  # ==================================================
  # RAW DEPENDENCY RULE
  # ==================================================
  - name: "RAW Hazard"
    type: "dependency_rule"
    description: >
      Detects Read After Write hazards where a consumer reads a register
      written by a producer that occurs earlier in the pipeline, and the
      dependency is not resolved via bypass.

    when:
      all:

        # Same register dependency
        - eq:
            - writes(producer)
            - reads(consumer)

        # Temporal ordering constraint
        - lt:
            - stage_index(stage_of(producer))
            - stage_index(stage_of(consumer))

        # No bypass resolution
        - not:
            bypass_exists:
              args: [producer, consumer]

    then:
      highlight:
        type: "dependency"
        label: "RAW"
        color: "#cc0000"

  # ==================================================
  # PIPELINE SEQUENCE RULE
  # ==================================================
  - name: "Pipeline Sequence Constraint"
    type: "ordering_rule"
    description: >
      Ensures instruction progression follows the pipeline-defined stage order
      declared in pipeline.stages. No independent ordering logic is defined here.

    when:
      any:

        # --------------------------------------------
        # VIOLATION 1: backward movement in stage lattice
        # --------------------------------------------
        - lt:
            - stage_index(stage_of(current))
            - stage_index(stage_of(previous))

        # --------------------------------------------
        # VIOLATION 2: stage not consistent with pipeline path
        # (resolved via pipeline.stages lookup)
        # --------------------------------------------
        - not:
            in_pipeline_order:
              args:
                - stage_of(previous)
                - stage_of(current)

    then:
      highlight:
        type: "ordering_violation"
        label: "SEQ"
        color: "#006600"

  # ==================================================
  # RESOURCE / CAPACITY RULE
  # ==================================================
  - name: "Resource Capacity Constraint"
    type: "capacity_rule"
    description: >
      Ensures that pipeline stage resources are not exceeded per column.
      Each stage group has a fixed capacity defined in the pipeline lattice.

    when:
      any:

        # overuse of stage resources in a column
        - gt:
            - resource_used(stage(current), column(current))
            - stage_capacity(stage(current))

    then:
      highlight:
        type: "resource_violation"
        label: "CAP"
        color: "#0066cc"

  # ==================================================
  # WAR DEPENDENCY RULE
  # ==================================================
  - name: "WAR Hazard"
    type: "dependency_rule"
    description: >
      Detects Write After Read hazards where a later instruction writes
      a register that an earlier instruction reads. In an in-order
      pipeline this is typically benign, but may indicate a register
      renaming opportunity or an out-of-order conflict.
    when:
      all:

        # Producer reads what consumer writes
        - eq:
            - reads(producer)
            - writes(consumer)

        # Producer is earlier in pipeline than consumer
        - lt:
            - stage_index(stage_of(producer))
            - stage_index(stage_of(consumer))

        # No bypass annotation resolves this pair
        - not:
            bypass_exists:
              args: [producer, consumer]

    then:
      highlight:
        type: "dependency"
        label: "WAR"
        color: "#cc6600"

  # ==================================================
  # WAW DEPENDENCY RULE
  # ==================================================
  - name: "WAW Hazard"
    type: "dependency_rule"
    description: >
      Detects Write After Write hazards where two instructions write
      the same destination register. If the pipeline can complete
      writes out of order, the earlier write may overwrite the later
      one, corrupting architectural state.
    when:
      all:

        # Both instructions write the same register
        - eq:
            - writes(producer)
            - writes(consumer)

        # Producer is earlier in pipeline than consumer
        - lt:
            - stage_index(stage_of(producer))
            - stage_index(stage_of(consumer))

        # No bypass annotation resolves this pair
        - not:
            bypass_exists:
              args: [producer, consumer]

    then:
      highlight:
        type: "dependency"
        label: "WAW"
        color: "#9900cc"

# --------------------------------------------------
# BYPASS MODEL (VISUAL ONLY — FUNCTIONALLY EQUIVALENT)
# --------------------------------------------------
bypass:

  semantics: "uniform"

  exists(a, b): true

  annotation_only: true

  colors:
    RAW: "#cc0000"
    WAR: "#cc6600"
    WAW: "#9900cc"
    CONTROL: "#006600"
    STRUCTURAL: "#0066cc"

# --------------------------------------------------
# DEFAULT BEHAVIOR
# --------------------------------------------------
defaults:

  evaluation_mode: "validation_only"

  unknown_expression:
    action: ignore

  no_violation:
    action: no_highlight
    
  rows: 10
  cols: 10
  
  start_state: "./config/tiny_rv1_example.json"
