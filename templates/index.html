<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Instruction Pipeline Scheduler</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<div class="container">
    <h1>CPU Instruction Pipeline Scheduler</h1>

    <div class="controls">
        <div class="control-group">
            <label for="rows-slider">Rows:</label>
            <input type="range" id="rows-slider" min="0" max="100" value="10">
            <span id="rows-value">10</span>
        </div>
        <div class="control-group">
            <label for="cols-slider">Columns:</label>
            <input type="range" id="cols-slider" min="0" max="100" value="10">
            <span id="cols-value">10</span>
        </div>

        <div class="control-group" style="margin-top:10px;">
            <label>Pipelines:</label>
            <label><input type="radio" name="pipelines" value="1" checked onchange="updatePipelineCount()"> 1</label>
            <label style="margin-left:10px;"><input type="radio" name="pipelines" value="2" onchange="updatePipelineCount()"> 2</label>
        </div>
    </div>

    <div class="rules-panel">
        <h3>Pipeline Rules</h3>

        <div class="rule-controls">
            <button id="enable-all-rules" onclick="toggleAllRules(true)">Enable All</button>
            <button id="disable-all-rules" onclick="toggleAllRules(false)" class="secondary">Disable All</button>
        </div>

        <div id="rules-list">
            <!-- Rules with checkboxes will be generated by JavaScript -->
        </div>

        <div id="violations-summary" class="violations-summary">
            <strong>⚠️ Rule Violations Detected:</strong>
            <div id="violations-list"></div>
        </div>
    </div>

    <!-- ========================================
     *NEW* Block Palette and Pipeline Tool
     Left side: draggable stage blocks.
     Right side: pipelining button that opens
     a type dropdown and enters annotation mode.
     ======================================== -->
    <div class="block-palette">
        <h3>Available Blocks (Drag to Grid)</h3>
        <div class="palette-and-pipeline">
            <div class="palette-blocks" id="palette">
                <!-- Blocks generated by JavaScript -->
            </div>

            <!-- Pipeline annotation tool -->
            <div class="pipeline-tool" id="pipeline-tool">
                <button class="pipeline-btn" id="pipeline-btn" onclick="togglePipelineMenu()">
                    &#10010; Add Pipeline
                </button>
                <!-- Dropdown populated by initPipelineTool() -->
                <div class="pipeline-type-list" id="pipeline-type-list"></div>
            </div>
        </div>
    </div>

<!-- ========================================
     Grid Container
     Row labels on the left; the grid (with its
     SVG overlay) in the middle; the annotation
     list panel on the right.
     ======================================== -->
<div class="grid-container">
    <div class="grid-and-annotations">

        <!-- Grid + row labels -->
        <div class="grid-wrapper">
            <div class="row-labels" id="row-labels"></div>
            <div id="grid-canvas">
                <div class="grid" id="grid"></div>
                <svg id="pipeline-svg"></svg>
            </div>
        </div>

        <!-- Annotation list panel - populated by renderAnnotationList() -->
        <div class="annotation-panel" id="annotation-panel">
            <h3>Pipeline Annotations</h3>
            <div id="annotation-list">
                <div class="annotation-panel-empty">No annotations yet.</div>
            </div>
        </div>

    </div>
</div>

    <div class="actions">
        <button onclick="saveState()">Save State</button>
        <button onclick="loadState()" class="secondary">Load State</button>
        <button onclick="clearGrid()" class="secondary">Clear Grid</button>
    </div>
</div>

<script>
    window.FLASK_DATA = {
        instructionFormats: {{ instruction_formats | tojson }},
        pipelineTypes:      {{ pipeline_types      | tojson }},
        pipelineCount:      {{ pipeline_count }}
    };
</script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>


<!-- Cursor-tracking circle shown while pipeline annotation mode is active -->
<div id="ghost-circle"></div>

</body>
</html>
